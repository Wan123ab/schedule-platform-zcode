# FlowOps CI（docs/09 M0 交付物：构建 + 单测 + 静态检查）
# 触发：PR 与 main 推送。后端矩阵编译 5 模块 + Flyway 语法随集成测试覆盖（M1 引 Testcontainers）。
#
# ⚠️ 2026-10-07（M2）：M2 起的开发全部在 dev_workbuddy 分支上进行，而原触发条件只覆盖
# main/PR —— 结果是"分支上的代码没有任何 CI 守卫"，与"推送前必须本地实跑"的约束叠加后
# 反而更容易漏网（本地跑过 ≠ CI 环境跑过）。故补上 dev_* 通配：开发分支同样必须过 CI。
# 用通配而非写死分支名：分支合并删除后无需回头改这里。
name: ci

on:
  pull_request:
  push:
    branches: [main, 'dev_*']

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    services:
      # 互斥锁集成测试（MutexLockManagerTest）用真实 Redis；
      # 本地无 Redis 时该测试经 Assumptions 自动跳过
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # ── PostgreSQL 16（M5 / O-9）──────────────────────────────────
      # 为什么必须加：在它进来之前，CI 里**没有**任何一道关卡会真正起
      # Spring 上下文并连一次数据库 —— 648 个用例全是分层单测。
      # 于是"Flyway 脚本在真实 PG 上能不能跑""进程能不能起来"
      # 这两件事从来没被验证过（代价见 README-M5 §3：一次性暴露了 4 个
      # 启动即死/静默失效级别的问题）。集成测试（*IT）现在要真跑。
      #
      # 端口映射 55432:5432 而不是 5432:5432：runner 镜像预装了 PostgreSQL，
      # 万一哪天默认启了服务会撞端口；对外用 55432 与本地免安装 PG16
      # 的约定端口一致，于是 IT_DB_PORT 的默认值两边都不用改。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
          POSTGRES_DB: flowops_it
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test (5 modules)
        working-directory: backend
        env:
          # 集成测试（*IT）的库连接参数；与本地免安装 PG16 的默认值一致，
          # 这里显式写出来是为了让"CI 用哪个库"在 YAML 里可读，而不是藏在默认值里。
          # 环境不可达时 IntegrationEnvironment 会让整类安静跳过，不会误报失败。
          IT_DB_HOST: 127.0.0.1
          IT_DB_PORT: '55432'
          IT_DB_NAME: flowops_it
          IT_DB_USER: flowops
          IT_DB_PASSWORD: flowops
          IT_REDIS_HOST: 127.0.0.1
          IT_REDIS_PORT: '6379'
        run: mvn -B -ntp verify
      # ⚠️ 2026-10-07（M3）：run #13 后端 job 失败，但当时**取不到失败详情** ——
      # 仓库没上传测试报告，而匿名请求 GitHub 的 job logs API 一律 403。
      # 那次失败后来查明是确定性的（测试依赖 JDK 运行期 dynamic attach，见 README-M3 §5-6），
      # 代价却是靠重跑才绕过去。失败时把 surefire 报告传上来：这是**不依赖任何凭据**的
      # 诊断路径（带上推送凭据请求 logs API 也能读到，但多一道手工步骤）。
      - name: Upload surefire reports（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend · lint & typecheck & test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests（权限点防漂移）
        working-directory: frontend
        run: pnpm test
      - name: Type check + build
        working-directory: frontend
        run: pnpm build
