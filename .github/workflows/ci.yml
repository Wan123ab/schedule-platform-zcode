# FlowOps CI（docs/09 M0 交付物：构建 + 单测 + 静态检查）
# 触发：PR 与 main 推送。后端矩阵编译 5 模块 + Flyway 语法随集成测试覆盖（M1 引 Testcontainers）。
#
# ⚠️ 2026-10-07（M2）：M2 起的开发全部在 dev_workbuddy 分支上进行，而原触发条件只覆盖
# main/PR —— 结果是"分支上的代码没有任何 CI 守卫"，与"推送前必须本地实跑"的约束叠加后
# 反而更容易漏网（本地跑过 ≠ CI 环境跑过）。故补上 dev_* 通配：开发分支同样必须过 CI。
# 用通配而非写死分支名：分支合并删除后无需回头改这里。
name: ci

on:
  pull_request:
  push:
    branches: [main, 'dev_*']

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    services:
      # 互斥锁集成测试（MutexLockManagerTest）用真实 Redis；
      # 本地无 Redis 时该测试经 Assumptions 自动跳过
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test (5 modules)
        working-directory: backend
        run: mvn -B -ntp verify
      # ⚠️ 2026-10-07（M3）：run #13 后端 job 失败，但**取不到失败详情** ——
      # 仓库既没上传测试报告，GitHub 的 job logs API 又需要 admin 权限，
      # 结果是"知道红了，不知道为什么红"，只能靠重跑来猜是不是 flaky。
      # 失败时把 surefire 报告传上来：哪怕只多一次往返，也好过靠猜。
      - name: Upload surefire reports（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend · lint & typecheck & test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests（权限点防漂移）
        working-directory: frontend
        run: pnpm test
      - name: Type check + build
        working-directory: frontend
        run: pnpm build
