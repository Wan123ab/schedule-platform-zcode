<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>集群详情 · FlowOps</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<script src="assets/js/icons.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  var cid = FO.qs('id') || 'CL-0001';
  var c = MOCK.clusters.filter(function (x) { return x.id === cid; })[0] || MOCK.clusters[0];
  var nodes = MOCK.nodes.filter(function (n) { return n.cluster === c.id; });
  var qs = MOCK.queues.filter(function (q) { return q.cluster === c.id; });

  function resBar(label, r, unit) {
    var pct = (r.used / r.total) * 100;
    var cls = pct >= 90 ? 'hot' : pct >= 70 ? 'warm' : 'oklv';
    return '<div class="rbar"><div class="rb-top"><span>' + label + '</span><span class="num">' + r.used + ' / ' + r.total + unit + '</span></div>'
      + '<div class="rb-track"><div class="rb-fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
  }

  var content = ''
    + '<div class="page-header"><div><h1>' + c.name + '</h1>'
    + '<div class="sub row">' + FO.tag('CLUSTER_STATUS', c.status) + '<span class="tag ' + (c.env === '生产' ? 'fail' : 'info') + '">' + c.env + '</span><span class="mono">' + c.id + '</span><span>最近心跳 ' + c.lastHb + '</span></div></div>'
    + '<div class="actions">'
    + '<button class="btn" data-perm="schedule:cluster:write" onclick="FO.toast(\'已进入维护状态，暂停新任务派发（演示）\',\'warn\')">设为维护</button>'
    + '<button class="btn danger" data-perm="schedule:cluster:write" onclick="delCluster()">' + FO_ICONS.get('trash') + '删除集群</button>'
    + '</div></div>'

    + '<div class="grid g4 mb-4">'
    + '<div class="panel metric"><div class="m-label">执行节点</div><div class="m-value">' + c.nodes + '<small>台</small></div><div class="m-foot">在线 ' + c.online + ' · 离线 ' + c.offline + ' · 空闲 ' + c.idle + '</div></div>'
    + '<div class="panel metric"><div class="m-label">正在执行任务</div><div class="m-value">' + c.running + '</div><div class="m-foot">队列并发按「出队时检查」生效（§12.3）</div></div>'
    + '<div class="panel metric"><div class="m-label">待执行任务</div><div class="m-value">' + c.pending + '</div><div class="m-foot">历史任务 ' + FO.fmt.num(c.history) + '</div></div>'
    + '<div class="panel metric"><div class="m-label">调度诊断可用性</div><div class="m-value" style="color:var(--ok)">正常</div><div class="m-foot">决策留痕 schedule_decision_log</div></div>'
    + '</div>'

    + '<div class="panel mb-4"><div class="panel-h"><b>资源总览</b></div><div class="panel-b grid g2">'
    + resBar('CPU', c.cpu, ' 核') + resBar('GPU', c.gpu, ' 卡') + resBar('内存', c.mem, ' GB'.replace('GB', '')) + resBar('磁盘', c.disk, ' GB')
    + '</div></div>'

    + '<div class="tabs" id="tabs">'
    + tab('nodes', '执行节点 <span class="cnt">' + nodes.length + '</span>')
    + tab('queues', '队列配置 <span class="cnt">' + qs.length + '</span>')
    + tab('running', '正在执行 <span class="cnt">' + c.running + '</span>')
    + tab('waiting', '待执行 <span class="cnt">' + c.pending + '</span>')
    + tab('history', '历史任务')
    + '</div>'
    + '<div class="panel"><div id="tabBody"></div></div>';

  FO.mountShell({ active: 'clusterList', title: '集群详情', crumb: [{ label: '集群管理', href: 'cluster-list.html' }], content: content });

  function tab(key, label) { return '<button class="tab-btn" data-tab="' + key + '">' + label + '</button>'; }

  /* ---------------- 各 Tab 渲染 ---------------- */
  var TABS = {
    nodes: function () {
      return '<div class="table-wrap"><table class="tbl"><thead><tr><th>节点</th><th>IP</th><th>连接方式</th><th>凭据</th><th>标签</th><th>在线状态</th><th>CPU</th><th>GPU</th><th>运行中</th><th>最近心跳</th><th style="text-align:right">操作</th></tr></thead><tbody>'
        + nodes.map(function (n) {
            var dot = n.status === 'ONLINE' ? (n.hbMiss > 0 ? 'warnbg' : 'on') : 'off';
            var hb = n.hbMiss > 0 ? '<span class="tag warn">心跳异常</span>' : '';
            return '<tr>'
              + '<td><a href="node-detail.html?id=' + n.id + '"><b>' + n.name + '</b></a></td>'
              + '<td class="mono">' + n.ip + '</td>'
              + '<td>' + n.conn + '</td>'
              + '<td><span class="mono tiny">CR-0001 ' + n.credFp + '</span></td>'
              + '<td>' + (n.tags.length ? n.tags.map(function (t) { return '<span class="node-tag">' + t + '</span>'; }).join(' ') : '<span class="faint tiny">—</span>') + '</td>'
              + '<td><span class="row" style="gap:6px"><i class="live-dot ' + dot + '"></i>' + FO.tag('NODE_ONLINE', n.status) + hb + '</span></td>'
              + '<td class="num">' + n.cpu.used + ' / ' + n.cpu.total + '</td>'
              + '<td class="num">' + (n.gpu.total ? n.gpu.used + ' / ' + n.gpu.total : '—') + '</td>'
              + '<td class="num">' + n.running + '</td>'
              + '<td class="mono tiny">' + n.lastHb + '</td>'
              + '<td><div class="actions">'
              + '<a class="btn xs" href="node-detail.html?id=' + n.id + '">详情</a>'
              + '<button class="btn xs" data-perm="schedule:node:test" onclick="testNode(\'' + n.id + '\')">连通测试</button>'
              + '</div></td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + '<div class="panel-b banner info" style="margin:0"><span data-ic="info"></span><div>心跳 15s 上报，<b>连续 3 次（45s）未上报才判离线</b>；单次缺失仅展示「心跳异常」标记，状态与告警不变（§12.2）· prod-compute-01-05 即单次缺失示例</div></div>';
    },
    queues: function () {
      return '<div class="table-wrap"><table class="tbl"><thead><tr><th>队列</th><th>状态</th><th>最大并发</th><th>最大等待</th><th>默认优先级</th><th>允许插队</th><th>等待超时</th><th>可使用项目</th><th>水位</th><th style="text-align:right">操作</th></tr></thead><tbody>'
        + qs.map(function (q) {
            return '<tr><td><b>' + q.name + '</b><div class="tiny faint mono">' + q.id + '</div></td>'
              + '<td><span class="tag ok">启用</span></td>'
              + '<td class="num">' + q.maxConc + '</td><td class="num">' + q.maxWait + '</td>'
              + '<td class="num">' + q.prio + '</td>'
              + '<td>' + (q.allowJump ? '<span class="tag ok">允许</span>' : '<span class="tag">禁止</span>') + '</td>'
              + '<td class="num">' + (q.waitTimeout / 60) + ' 分钟</td>'
              + '<td class="tiny">PRJ-0001 · PRJ-0002</td>'
              + '<td><div class="rbar" style="width:110px"><div class="rb-top"><span class="num">' + q.running + ' / ' + q.maxConc + ' 并发</span></div><div class="rb-track"><div class="rb-fill ' + (q.running >= q.maxConc ? 'hot' : 'oklv') + '" style="width:' + (q.running / q.maxConc * 100) + '%"></div></div></div></td>'
              + '<td><div class="actions"><button class="btn xs" data-perm="schedule:queue:write" onclick="editQueue(\'' + q.id + '\')">编辑</button></div></td></tr>';
          }).join('')
        + '</tbody></table></div>'
        + '<div class="panel-b banner warn" style="margin:0"><span data-ic="alert"></span><div><b>队列级默认并发 3 偏保守</b>（v3 回写 R-7 提示项）：按首年峰值 500 次/h、全平台并发 300 反推，队列多时应按「Σ队列并发 ≈ 平台并发容量」设置，或创建时由运维按用途手填</div></div>';
    },
    running: function () {
      var rows = MOCK.tasks.filter(function (t) { return ['RUNNING', 'STOPPING'].indexOf(t.status) >= 0 && t.cluster === c.name; });
      return taskTable(rows, ['stop']);
    },
    waiting: function () {
      var rows = MOCK.tasks.filter(function (t) { return ['PENDING', 'SCHEDULING'].indexOf(t.status) >= 0; });
      return taskTable(rows, ['jump']);
    },
    history: function () {
      var rows = MOCK.tasks.filter(function (t) { return ['SUCCESS', 'FAILED', 'STOPPED', 'TIMEOUT', 'PARTIAL'].indexOf(t.status) >= 0; });
      return taskTable(rows, []);
    }
  };

  function taskTable(rows, actions) {
    if (!rows.length) return '<div class="empty">' + FO_ICONS.get('check') + '<p>暂无任务</p></div>';
    return '<div class="table-wrap"><table class="tbl"><thead><tr><th>任务编号</th><th>工作流</th><th>触发</th><th>队列</th><th>状态</th><th>提交人</th><th>提交时间</th><th style="text-align:right">操作</th></tr></thead><tbody>'
      + rows.map(function (t) {
          var act = '';
          if (actions.indexOf('stop') >= 0) act += FO.iconAct('stop', '强制停止（原因必填）', 'stopTask(\'' + t.id + '\')', 'danger', 'schedule:task:stop');
          if (actions.indexOf('jump') >= 0) act += FO.iconAct('bolt', '插队（下次出队生效）', 'jumpQueue(\'' + t.id + '\')', '', 'schedule:task:enqueue_front');
          return '<tr><td><a class="link-id" href="task-detail.html?id=' + t.id + '">' + t.id + '</a></td>'
            + '<td>' + t.wfName + '</td><td>' + FO.tag('TRIGGER_TYPE', t.trigger) + '</td>'
            + '<td><span class="node-tag">' + t.queue + '</span></td>'
            + '<td>' + FO.statusTag(t.status) + '</td>'
            + '<td class="tiny">' + t.submitter + '</td><td class="mono tiny">' + t.submitAt + '</td>'
            + '<td><div class="actions">' + act + '</div></td></tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  /* ---------------- Tab 切换 ---------------- */
  function showTab(key) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === key); });
    document.getElementById('tabBody').innerHTML = TABS[key]();
    FO.applyPerms(document);
    document.querySelectorAll('[data-ic]').forEach(function (el) { el.innerHTML = FO_ICONS.get(el.getAttribute('data-ic')); });
  }
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });
  showTab('nodes');

  /* ---------------- 交互 ---------------- */
  window.testNode = function (nid) {
    var n = MOCK.nodes.filter(function (x) { return x.id === nid; })[0];
    FO.toast('正在使用凭据 CR-0001 ' + n.credFp + ' 尝试 SSH 握手…', 'info');
    setTimeout(function () {
      if (n.status === 'OFFLINE') FO.toast('连接失败：Connection timed out（10.0.12.104:22）——节点已判离线，请检查网络或节点侧 SSH 服务', 'fail', '连通性测试失败');
      else FO.toast('SSH 握手成功 · 耗时 340ms · 主机指纹已在白名单（首次确认后写入）', 'ok', '连通性测试通过');
    }, 900);
  };

  window.stopTask = function (tid) {
    FO.confirm({
      title: '强制停止任务', requireReason: true,
      message: '任务 <b class="mono">' + tid + '</b> 上所有运行中步骤的进程将被终止（kill -TERM → 10s → kill -KILL），状态进入 <b>STOPPING</b>，由调度器收敛为 STOPPED。',
      okText: '停止任务',
      onOk: function (reason) {
        var t = MOCK.tasks.filter(function (x) { return x.id === tid; })[0];
        t.status = 'STOPPING'; t.stopReason = reason; t.stoppedBy = 'ops001（演示）';
        FO.toast('已提交停止指令：' + tid + ' → STOPPING，等待调度器终止进程', 'warn');
        showTab(curTab);
        setTimeout(function () { t.status = 'STOPPED'; FO.toast(tid + ' 已收敛为 STOPPED（已停止），停止人与原因已记录', 'ok'); if (curTab === 'running') showTab('running'); }, 4000);
      }
    });
  };

  window.jumpQueue = function (tid) {
    FO.confirm({
      title: '待执行任务插队', message: '将 <b class="mono">' + tid + '</b> 移到队首（调整 ZSet score），下次出队立即生效。插队仅平台管理员/运维可用，操作进审计。',
      okText: '确认插队',
      onOk: function () { FO.toast('score 已更新，' + tid + ' 将在下次出队时第一个被匹配（演示）', 'ok', '插队成功'); }
    });
  };

  window.editQueue = function (qid) {
    var q = MOCK.queues.filter(function (x) { return x.id === qid; })[0];
    FO.modal({
      title: '队列配置 · ' + q.name,
      body: '<div class="form-grid">'
        + '<div class="field"><label>最大并发任务数</label><input class="input" value="' + q.maxConc + '"><div class="help">出队时检查；满则本队列本 tick 不出队</div></div>'
        + '<div class="field"><label>最大等待任务数</label><input class="input" value="' + q.maxWait + '"><div class="help">提交时检查；满则 40902</div></div>'
        + '<div class="field"><label>默认优先级（0~100）</label><input class="input" value="' + q.prio + '"></div>'
        + '<div class="field"><label>等待超时（秒）</label><input class="input" value="' + q.waitTimeout + '"><div class="help">超时步骤标记「调度失败」</div></div>'
        + '</div>'
        + '<div class="field"><label class="row">允许插队 <span class="switch lg"><input type="checkbox" ' + (q.allowJump ? 'checked' : '') + '><i></i></span></label><div class="help">关闭后仅运维按授权执行插队并留痕</div></div>',
      onOk: function () { FO.toast('队列配置已保存，写审计（演示）', 'ok'); }
    });
  };

  window.delCluster = function () {
    var running = c.running;
    FO.modal({
      title: '删除集群 · ' + c.name, okText: '我知道了',
      body: '<div class="banner danger"><span data-ic="alert"></span><div>'
        + (running > 0
          ? '<b>存在 ' + running + ' 个运行中任务，不可直接删除</b>（规则 1）'
          : '无运行中任务')
        + '<br><span class="b-sub">删除前置：① 无运行中任务 ② 确认解绑项目与队列 ③ 先删除或迁移全部执行节点（当前 ' + c.nodes + ' 台，<b>未清空</b>）④ 删除进审计</span></div></div>',
      footer: '<button class="btn" data-act="cancel">关闭</button>'
    });
  };

  var curTab = 'nodes';
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () { curTab = b.dataset.tab; });
  });

  document.querySelectorAll('[data-ic]').forEach(function (el) { el.innerHTML = FO_ICONS.get(el.getAttribute('data-ic')); });
})();
</script>
</body>
</html>
