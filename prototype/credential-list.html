<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>凭据管理 · FlowOps</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .fp { font-family: var(--font-mono); letter-spacing: 1px; background: var(--bg-inset); border: 1px dashed var(--line); padding: 1px 8px; border-radius: var(--r-xs); }
  .sec-note { position: relative; overflow: hidden; }
  .sec-note::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, var(--fail-soft), transparent 70%); }
</style>
</head>
<body>
<script src="assets/js/icons.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  var content = ''
    + '<div class="page-header"><div><h1>凭据管理</h1><div class="sub">连接执行节点的认证信息（SSH 密码 / 密钥）——全平台安全等级最高的资产 · PRD §10.5</div></div>'
    + '<div class="actions"><button class="btn primary" data-perm="schedule:credential:write" id="btnNew">' + FO_ICONS.get('plus') + '创建凭据</button></div></div>'

    + '<div class="banner danger sec-note mb-4"><span data-ic="lock"></span><div>'
    + '<b>安全红线：没有任何角色可以查看凭据明文（包括平台管理员）</b>，平台只做引用与注入。接口永不返回明文，仅返回指纹；解密仅在执行下发时于内存中发生，用完即弃。<br>'
    + '<span class="b-sub">AES-256-GCM 加密存储 · 主密钥来自环境变量（缺失则拒绝启动，M-06）· 所有凭据操作强制审计</span></div></div>'

    + '<div id="credMetrics"></div>'

    + '<div class="panel"><div class="table-wrap"><table class="tbl"><thead><tr>'
    + '<th>凭据</th><th>类型</th><th>归属</th><th>指纹（脱敏）</th><th>引用节点数</th><th>状态</th><th>最近使用</th><th style="text-align:right">操作</th>'
    + '</tr></thead><tbody id="tb"></tbody></table></div></div>'

    + '<div class="grid g2 mt-4">'
    + '<div class="panel"><div class="panel-h"><b>轮换流程（灰度切换）</b></div><div class="panel-b">'
    + '<div class="stepper"><span class="stp on"><span class="n">1</span>新建凭据版本</span><span class="ln"></span>'
    + '<span class="stp on"><span class="n">2</span>灰度 1 台节点验证</span><span class="ln"></span>'
    + '<span class="stp on"><span class="n">3</span>全量切换</span><span class="ln"></span>'
    + '<span class="stp"><span class="n">4</span>旧版本保留 7 天</span></div>'
    + '<p class="small muted">旧版本在保留期内可一键回滚；点击凭据可查看「被哪些执行节点引用」，<b>轮换影响范围对操作者可见</b>。</p></div></div>'
    + '<div class="panel"><div class="panel-h"><b>失效处理</b></div><div class="panel-b"><ul class="check-list">'
    + '<li>凭据失效或轮换失败 → 关联执行节点标记「连接异常」并触发告警</li>'
    + '<li><b>不中断正在运行的任务</b>（避免批量任务被误杀）</li>'
    + '<li>新的调度任务不再派发到「连接异常」的节点</li>'
    + '<li>引用计数 &gt; 0 的凭据不可删除（实时 COUNT 校验 + DB 外键 RESTRICT 双保险）</li>'
    + '</ul></div></div>'
    + '</div>';

  FO.mountShell({ active: 'credentialList', title: '凭据管理', crumb: [{ label: '系统管理' }], content: content });

  render();

  /* 凭据总览指标 */
  document.getElementById('credMetrics').innerHTML = FO.metricsStrip([
    { label: '凭据总数', value: MOCK.credentials.length, icon: 'credential' },
    { label: '引用节点数', value: MOCK.credentials.reduce(function (s, c) { return s + c.refCount; }, 0), icon: 'node' },
    { label: '即将过期', value: MOCK.credentials.filter(function (c) { return c.status === 'EXPIRING'; }).length, tone: 'warn', icon: 'clock' },
    { label: '轮换保留期内', value: 1, icon: 'retry' }
  ]);

  function render() {
    document.getElementById('tb').innerHTML = MOCK.credentials.map(function (cr) {
      var typeL = { SSH_KEY: 'SSH 密钥', USER_PASSWORD: '密码', WINRM: 'WinRM', TOKEN: 'Token' }[cr.type];
      var locked = cr.refCount > 0;
      return '<tr>'
        + '<td><b>' + cr.name + '</b><div class="tiny faint mono">' + cr.id + '</div></td>'
        + '<td>' + typeL + '</td>'
        + '<td>' + (cr.scope === '平台级' ? '<span class="tag pri">平台级</span>' : '<span class="tag info">项目级 · ' + cr.project + '</span>') + '</td>'
        + '<td><span class="fp">' + cr.fingerprint + '</span></td>'
        + '<td class="num"><a href="javascript:void(0)" onclick="showRefs(\'' + cr.id + '\')">' + cr.refCount + ' 个节点</a></td>'
        + '<td>' + FO.tag('CRED_STATUS', cr.status) + (cr.status === 'EXPIRING'
            ? '<div class="tiny faint">2026-10-01 到期</div><div class="rbar mt-2" style="min-width:90px"><div class="rb-track"><div class="rb-fill warm" style="width:78%"></div></div></div><div class="tiny ghost-c">距到期 6 / 30 天</div>' : '') + '</td>'
        + '<td class="mono tiny">' + cr.lastUsed + '</td>'
        + '<td><div class="actions">'
        + FO.iconAct('retry', '轮换凭据（三步灰度）', 'rotate(\'' + cr.id + '\')', '', 'schedule:credential:rotate')
        + FO.iconAct('trash', cr.refCount > 0 ? '引用计数 > 0，不可删除（当前 ' + cr.refCount + ' 个引用）' : '删除凭据', 'delCred(\'' + cr.id + '\')', 'danger', 'schedule:credential:write')
        + '</div></td></tr>';
    }).join('');
    FO.applyPerms(document);
    document.querySelectorAll('[data-ic]').forEach(function (el) { el.innerHTML = FO_ICONS.get(el.getAttribute('data-ic')); });
  }

  window.showRefs = function (id) {
    var cr = MOCK.credentials.filter(function (x) { return x.id === id; })[0];
    FO.modal({
      title: '引用关系 · ' + cr.name, width: 460, okText: '关闭',
      body: (cr.refCount > 0
        ? '<p class="small muted mb-3">该凭据被以下执行节点引用（<b>' + cr.refCount + '</b> 个）。轮换将影响这些节点，请确认灰度顺序。</p>'
          + '<div class="code">executor_node 引用（executor_node.credential_ref_id → credential.id）\n'
          + cr.nodes.map(function (n) { return '  ├─ ' + n; }).join('\n') + '\n  └─ 共 ' + cr.refCount + ' 条（实时 COUNT 校验，冗余计数仅展示）</div>'
        : '<div class="empty">' + FO_ICONS.get('check') + '<p>当前无执行节点引用，可安全删除</p></div>')
  });
  };

  window.rotate = function (id) {
    var cr = MOCK.credentials.filter(function (x) { return x.id === id; })[0];
    FO.modal({
      title: '轮换凭据 · ' + cr.name, width: 560,
      body: '<div class="stepper"><span class="stp on"><span class="n">1</span>新建版本</span><span class="ln"></span>'
        + '<span class="stp"><span class="n">2</span>灰度验证</span><span class="ln"></span>'
        + '<span class="stp"><span class="n">3</span>全量切换</span></div>'
        + '<div class="field"><label>新认证信息 <span class="req">*</span></label><input class="input" type="password" placeholder="粘贴新的私钥或密码（提交后永不可再查看）"></div>'
        + '<div class="field"><label>灰度节点</label><select class="select"><option>prod-compute-01-05（建议先灰度 1 台）</option><option>prod-compute-01-01</option></select></div>'
        + '<div class="banner warn" style="margin-bottom:0"><span data-ic="alert"></span><div>影响范围：当前引用节点 <b>' + cr.refCount + '</b> 个。旧版本指纹 ' + cr.fingerprint + ' 将保留 7 天作为回滚窗口；轮换失败时关联节点标记「连接异常」并告警，<b>运行中任务不受影响</b></div></div>',
      okText: '下一步：灰度验证',
      onOk: function () {
        FO.toast('新版本已创建，正在对灰度节点执行连通性验证…', 'info');
        setTimeout(function () {
          FO.toast('灰度节点握手成功（340ms）· 可执行「全量切换」，旧指纹 ' + cr.fingerprint + ' 保留至 2026-10-01', 'ok', '灰度验证通过');
        }, 1200);
      }
    });
  };

  window.delCred = function (id) {
    var cr = MOCK.credentials.filter(function (x) { return x.id === id; })[0];
    if (cr.refCount > 0) { FO.toast('42202：凭据被 ' + cr.refCount + ' 个执行节点引用，禁止删除', 'fail'); return; }
    FO.confirm({
      title: '删除凭据', danger: true,
      message: '凭据 <b>' + cr.name + '</b>（' + cr.fingerprint + '）将被逻辑删除。该操作写入审计日志，删除后不可恢复（密文随主密钥体系销毁）。',
      okText: '确认删除', requireReason: true,
      onOk: function () { FO.toast('凭据已删除（逻辑删除 + 审计留痕，演示）', 'ok'); }
    });
  };

  document.getElementById('btnNew').addEventListener('click', function () {
    FO.modal({
      title: '创建凭据',
      body: '<div class="form-grid">'
        + '<div class="field"><label>名称 <span class="req">*</span></label><input class="input" placeholder="如：大数据集群密钥"></div>'
        + '<div class="field"><label>类型</label><select class="select"><option>SSH 密钥</option><option>密码</option><option disabled>WinRM（预留）</option><option disabled>Token（预留）</option></select></div></div>'
        + '<div class="field"><label>归属</label><select class="select"><option>平台级</option><option>项目级（PRJ-0001 电商数据平台）</option></select></div>'
        + '<div class="field"><label>认证信息 <span class="req">*</span></label><textarea class="textarea" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----（粘贴后服务端加密存储，界面永不再显示）"></textarea>'
        + '<div class="help">服务端生成指纹（SHA-256），用于后续识别；明文不落日志、不落快照</div></div>',
      onOk: function () { FO.toast('凭据已创建，指纹 ****x91f（演示）· 创建动作已写入审计', 'ok'); }
    });
  });
})();
</script>
</body>
</html>
